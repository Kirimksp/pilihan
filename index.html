<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membuka Galeri Foto...</title>
  <style>
    body { background:#111113; color:#FFE100; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; }
    .box { max-width:340px; padding:24px; }
    .spin { width:32px; height:32px; border:3px solid #FFE100; border-right-color:transparent; border-radius:50%; animation:s .7s linear infinite; margin:0 auto 14px; }
    @keyframes s { to { transform:rotate(360deg); } }
    a { display:inline-block; margin-top:16px; padding:10px 18px; background:#FFE100; color:#111113; text-decoration:none; font-weight:bold; border-radius:10px; font-size:14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <div>Membuka Galeri Foto...</div>
    <a id="btnOpen" href="#">Klik di sini jika tidak terbuka otomatis</a>
  </div>
  <script>
    var TARGET_EXEC = "URL_EXEC_KAMU";
    var params = new URLSearchParams(window.location.search);
    var g = params.get("g");
    var finalUrl = TARGET_EXEC + (g ? ("?g=" + encodeURIComponent(g)) : "");
    document.getElementById("btnOpen").href = finalUrl;
    window.location.replace(finalUrl);
  </script>
</body>
</html>
